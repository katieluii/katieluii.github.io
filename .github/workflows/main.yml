name: Verify site (publication protected)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Other workflows may verify an exact commit. This workflow has no deploy
  # action; publication remains in the protected Atlas release process.
  workflow_call:
    inputs:
      deployment_ref:
        description: Exact commit produced by the calling workflow
        required: true
        type: string

permissions:                                                                                           
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true                                                                               

jobs:                                                                                                    
  build:                                                  
    runs-on: ubuntu-latest                                                                             
    env:
      VITE_WS21_APP_URL: https://ws21-clinical-trial-analyst-production.up.railway.app
    steps:
      # Pin the reviewed triggering commit, or the exact data commit from the caller.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20                                                                               
          cache: npm
                                                                                                         
      - name: Install dependencies
        run: npm ci

      # Gates, in order of cheapness. All three block the deploy on a non-zero exit.
      # Added 2026-07-23: previously this job ran `npm run build` alone, so neither
      # the type checker nor the Atlas leak gate ever ran on the deploy path.
      - name: Typecheck
        run: npm run typecheck

      # Mutation tests for the publish gates THEMSELVES (Move 2, red-team 2026-08-29).
      # Stdlib unittest, no pip install. They pin the historical bypasses: the ws13
      # key leak, a blanked D6R baseline, a bundle edited after gating.
      - name: Atlas gate unit tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Atlas leak gate (committed tree)
        run: python3 scripts/sync-atlas-content.py --verify-only

      - name: Six-indication public scope
        run: python3 scripts/check_atlas_scope.py

      - name: Build
        run: npm run build

      - name: Release authorization tests
        run: node --test scripts/tests/atlas-release-*.test.mjs

      # Enrollment must bind genuine approvals to these exact built bytes.
      # Ordinary upload/deploy actions cannot consume the protected release ledger.
      - name: Record protected publication hold
        run: |
          echo "Site build and publication checks passed." >> "$GITHUB_STEP_SUMMARY"
          echo "No deployment attempted. Publication requires the protected Atlas release process; this verification workflow cannot authorize it." >> "$GITHUB_STEP_SUMMARY"
