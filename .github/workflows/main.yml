name: Deploy to GitHub Pages

on:                                                                                                      
  push:                                                                                                  
    branches: [main]                                                                                     
  workflow_dispatch:                                                                                     
                                                                                                       
permissions:                                                                                           
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true                                                                               

jobs:                                                                                                    
  build:                                                  
    runs-on: ubuntu-latest                                                                             
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20                                                                               
          cache: npm
                                                                                                         
      - name: Install dependencies
        run: npm ci

      # Gates, in order of cheapness. All three block the deploy on a non-zero exit.
      # Added 2026-07-23: previously this job ran `npm run build` alone, so neither
      # the type checker nor the Atlas leak gate ever ran on the deploy path.
      - name: Typecheck
        run: npm run typecheck

      - name: Atlas leak gate (committed tree)
        run: python3 scripts/sync-atlas-content.py --verify-only

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:                                                                                            
          path: './dist'
                                                                                                         
  deploy:                                                 
    needs: build                                                                                       
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:                                                                                               
      - name: Deploy to GitHub Pages
        id: deployment                                                                                   
        uses: actions/deploy-pages@v4
