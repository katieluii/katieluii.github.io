name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Lets refresh-13f.yml deploy the data it just committed. A push made with the
  # default GITHUB_TOKEN does NOT trigger `on: push`, so without this the
  # refreshed 13F JSON would land on main and never reach the live site.
  workflow_call:

permissions:                                                                                           
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true                                                                               

jobs:                                                                                                    
  build:                                                  
    runs-on: ubuntu-latest                                                                             
    steps:
      # Build the branch tip, not the triggering SHA. When called from
      # refresh-13f.yml the triggering SHA predates the data commit that job
      # just pushed, so checking out github.sha would deploy stale data.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20                                                                               
          cache: npm
                                                                                                         
      - name: Install dependencies
        run: npm ci

      # Gates, in order of cheapness. All three block the deploy on a non-zero exit.
      # Added 2026-07-23: previously this job ran `npm run build` alone, so neither
      # the type checker nor the Atlas leak gate ever ran on the deploy path.
      - name: Typecheck
        run: npm run typecheck

      # Mutation tests for the publish gates THEMSELVES (Move 2, red-team 2026-08-29).
      # Stdlib unittest, no pip install. They pin the historical bypasses: the ws13
      # key leak, a blanked D6R baseline, a bundle edited after gating.
      - name: Atlas gate unit tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Atlas leak gate (committed tree)
        run: python3 scripts/sync-atlas-content.py --verify-only

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:                                                                                            
          path: './dist'
                                                                                                         
  deploy:                                                 
    needs: build                                                                                       
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:                                                                                               
      - name: Deploy to GitHub Pages
        id: deployment                                                                                   
        uses: actions/deploy-pages@v4
