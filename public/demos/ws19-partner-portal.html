<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge · partner shortlist</title>
<meta name="description" content="Edge ranks the companies attending a partnering conference against your own angle, in your browser, and drafts the first-touch note for each.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── Renascor palette on bone (matches the suite home page). One ground, one metal:
     green-deep carries ink + the primary button; brass is the only accent. Hue never
     carries meaning alone — status reads as text + dot shape, rank as a numeral. ── */
  :root{
    --bg:#F3EFE7; --surface:#FAF8F3; --ink:#101512; --ink-strong:#042A1D;
    --muted:rgba(16,21,18,.64); --faint:rgba(16,21,18,.42);
    --hair:rgba(4,42,29,.16); --hair-soft:rgba(4,42,29,.09); --hover:rgba(4,42,29,.05);
    --accent:#8F7420; --accent-strong:#C9A227; --accent-bg:rgba(201,162,39,.12);
    --btn-bg:#042A1D; --btn-fg:#F3EFE7;
    --seg1:#042A1D; --seg2:rgba(4,42,29,.62); --seg3:rgba(4,42,29,.38); --seg4:rgba(4,42,29,.22);
    --radius:10px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
       font-feature-settings:'tnum' 1,'ss01' 1}
  a{color:var(--ink-strong)}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  button:focus-visible,[tabindex]:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .num{font-variant-numeric:tabular-nums}

  /* ── top bar ── */
  .top{border-bottom:1px solid var(--hair);background:var(--bg);position:sticky;top:0;z-index:5}
  .top-in{max-width:1080px;margin:0 auto;padding:12px 22px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .mark{font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent)}
  .who{font-size:15px;font-weight:600;color:var(--ink-strong)}
  .who .x{color:var(--faint);font-weight:400;margin:0 6px}
  .top-r{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--muted)}
  .top-r a{font-weight:600;text-decoration:none;color:var(--ink-strong)}
  .top-r a:hover{text-decoration:underline}
  .notice{background:var(--accent-bg);border-bottom:1px solid var(--hair);font-size:12.5px;color:var(--ink);padding:7px 22px;display:none}
  .notice.on{display:block}
  .notice-in{max-width:1080px;margin:0 auto}
  .notice a{font-weight:600}

  .wrap{max-width:1080px;margin:0 auto;padding:18px 22px 64px}

  /* ── the angle: one sentence, editable underneath ── */
  .angle{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);padding:14px 18px}
  .angle-line{display:flex;align-items:flex-start;gap:12px;flex-wrap:nowrap}
  .angle-txt{font-size:16px;line-height:1.45;flex:1;min-width:0}
  .angle-txt b{color:var(--ink-strong);font-weight:600}
  .angle-txt .w{display:block;color:var(--muted);font-size:13px;margin:3px 0 0}
  .angle-btn{margin-left:auto;flex:none;border:1px solid var(--hair);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink-strong);background:var(--bg)}
  .angle-btn:hover{background:var(--hover)}
  .angle-btn[aria-expanded="true"]{background:var(--ink-strong);color:var(--btn-fg);border-color:var(--ink-strong)}
  .form{display:none;border-top:1px solid var(--hair-soft);margin-top:14px;padding-top:14px}
  .form.open{display:block}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .fld{display:block;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted);margin-bottom:5px}
  .fld .why{font-weight:400;color:var(--faint)}
  textarea,input[type=text],input[type=search]{width:100%;border:1px solid var(--hair);border-radius:8px;padding:9px 11px;font:inherit;background:#fff;color:var(--ink);resize:vertical}
  textarea{min-height:58px}
  textarea::placeholder,input::placeholder{color:var(--faint)}
  .row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:12px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair);border-radius:999px;padding:4px 10px;font-size:13px;background:var(--bg);cursor:pointer;user-select:none}
  .chip input{accent-color:var(--ink-strong);margin:0}
  .chip.on{background:var(--ink-strong);color:var(--btn-fg);border-color:var(--ink-strong)}
  .lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;min-width:96px}
  .parsed{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:18px}
  .parsed b{color:var(--ink-strong);font-weight:600}
  .parsed.warn{color:var(--accent)}
  .btn{border-radius:8px;padding:9px 15px;font-size:14px;font-weight:600;border:1px solid transparent}
  .btn-p{background:var(--btn-bg);color:var(--btn-fg)}
  .btn-p:hover{filter:brightness(1.15)}
  .btn-g{background:var(--bg);border-color:var(--hair);color:var(--ink-strong)}
  .btn-g:hover{background:var(--hover)}
  .btn-p .dot{display:none;width:7px;height:7px;border-radius:50%;background:var(--accent-strong);margin-left:8px;vertical-align:middle}
  .btn-p.dirty .dot{display:inline-block}
  .sl{display:grid;grid-template-columns:200px 1fr 34px;align-items:center;gap:10px;font-size:13px;margin:6px 0}
  .sl input{width:100%;accent-color:var(--ink-strong)}
  .sl b{text-align:right;color:var(--ink-strong)}
  .subh{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
  .hint{font-size:12.5px;color:var(--muted)}

  /* ── tabs + search ── */
  .bar{display:flex;align-items:center;gap:6px;margin:18px 0 8px;flex-wrap:wrap}
  .tab{padding:8px 14px;border-radius:8px;font-size:14px;color:var(--muted);font-weight:500;border:1px solid transparent}
  .tab[aria-selected="true"]{background:var(--surface);color:var(--ink-strong);border-color:var(--hair);font-weight:600}
  .tab .n{color:var(--faint);font-weight:500;margin-left:5px}
  .search{margin-left:auto;display:flex;align-items:center;gap:8px}
  .search input{width:280px;max-width:60vw;padding:7px 11px;font-size:13.5px}
  .export{font-size:13px;font-weight:600;color:var(--ink-strong);border:1px solid var(--hair);border-radius:8px;padding:7px 11px;background:var(--surface)}
  .export:hover{background:var(--hover)}

  /* ── the shortlist as a ledger: rank rail on the left, one hairline per row ── */
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 6px 62px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair);position:relative}
  .ledger::before{content:"";position:absolute;left:24px;top:0;bottom:0;width:1px;background:var(--hair)}
  .r{position:relative}
  .rb{display:grid;grid-template-columns:48px minmax(0,1fr) 168px minmax(0,1.1fr);gap:0 14px;align-items:center;width:100%;text-align:left;
      padding:12px 10px 12px 0;border-bottom:1px solid var(--hair-soft);border-radius:0}
  .rb:hover{background:var(--hover)}
  .rk{position:relative;z-index:1;justify-self:center;background:var(--bg);padding:2px 5px;font-size:15px;font-weight:600;color:var(--accent);line-height:1}
  .rb:hover .rk{background:transparent}
  .r.top .rk{color:var(--ink-strong)}
  .r.top .rk::after{content:"";display:block;width:100%;height:2px;background:var(--accent-strong);margin-top:3px;border-radius:1px}
  .nm{font-size:15.5px;font-weight:600;color:var(--ink-strong);line-height:1.25}
  .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
  .meta .sep{margin:0 5px;color:var(--faint)}
  .meta .thin{color:var(--accent);font-weight:600}
  .fit{display:flex;align-items:center;gap:10px}
  .fitn{font-size:17px;font-weight:600;color:var(--ink-strong);width:30px;text-align:right}
  .seg{display:flex;height:9px;width:118px;background:var(--hair-soft);border-radius:2px;overflow:hidden}
  .seg i{display:block;height:100%}
  .rs{font-size:12.5px;color:var(--muted);line-height:1.35}
  .rs b{color:var(--ink);font-weight:600}
  .empty{padding:28px 10px 28px 62px;color:var(--muted);font-size:14px;border-bottom:1px solid var(--hair-soft)}
  .empty b{color:var(--ink-strong)}
  .excl .nm{color:var(--ink)}
  .excl .rk{color:var(--faint);font-weight:500;font-size:12px}
  .excl .rs{color:var(--accent)}
  .more{padding:12px 0 0 62px;font-size:13px}
  .more button{font-weight:600;color:var(--ink-strong);text-decoration:underline}

  /* ── outreach queue ── */
  .queue{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .qc{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);padding:14px 16px;text-align:left;width:100%}
  .qc:hover{background:var(--hover)}
  .qh{display:flex;align-items:center;gap:10px}
  .qn{font-weight:600;color:var(--ink-strong)}
  .st{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--ink);border:1px solid var(--hair);border-radius:999px;padding:2px 9px;white-space:nowrap}
  .st::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px dashed var(--accent)}
  .st.approved::before{border:1.5px solid var(--accent)}
  .st.sent::before{border:0;background:var(--accent-strong)}
  .qm{white-space:pre-wrap;font-size:13px;color:var(--muted);margin-top:8px;max-height:96px;overflow:hidden;
      -webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}

  /* ── card (dialog) ── */
  .scrim{position:fixed;inset:0;background:rgba(16,21,18,.42);display:none;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:20;overflow:auto}
  .scrim.open{display:flex}
  .card{background:var(--surface);border-radius:12px;width:min(680px,100%);border-top:3px solid var(--accent-strong);box-shadow:0 20px 60px rgba(4,42,29,.25)}
  .ch{padding:18px 22px 14px;border-bottom:1px solid var(--hair);display:flex;gap:12px;align-items:flex-start}
  .ch h2{margin:0;font-size:19px;font-weight:600;color:var(--ink-strong);line-height:1.25}
  .ch .meta{margin-top:4px}
  .close{margin-left:auto;font-size:22px;line-height:1;color:var(--muted);padding:2px 6px}
  .close:hover{color:var(--ink)}
  .cb{padding:16px 22px}
  .cb h3{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .why{list-style:none;margin:0 0 6px;padding:0}
  .why li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--hair-soft);font-size:14px}
  .why li i{width:10px;height:10px;border-radius:2px;display:inline-block;align-self:center}
  .why li b{font-weight:600;color:var(--ink-strong)}
  .why li span{display:block;font-size:12.5px;color:var(--muted)}
  .why li em{font-style:normal;color:var(--muted);font-size:12.5px;white-space:nowrap}
  .data{font-size:12.5px;color:var(--muted);margin:8px 0 16px}
  .data b{color:var(--ink);font-weight:600}
  details{margin:0 0 14px}
  summary{cursor:pointer;font-size:13px;color:var(--muted)}
  details p{margin:6px 0 0;font-size:13.5px;color:var(--ink)}
  .flag{font-size:12.5px;color:var(--accent);font-weight:600;margin:0 0 6px}
  .draft{width:100%;min-height:150px;font-size:14px;line-height:1.5}
  .cc{font-size:12px;color:var(--faint);margin-top:4px}
  .cf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 22px 16px;border-top:1px solid var(--hair)}
  .cf .note{margin-right:auto;font-size:12px;color:var(--faint);align-self:center}
  a.btn{text-decoration:none;display:inline-block}

  .foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}
  .foot b{color:var(--ink);font-weight:600}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink-strong);color:var(--btn-fg);padding:10px 16px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw}
  .toast.show{opacity:1}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media (max-width:760px){
    .g2,.queue{grid-template-columns:1fr}
    .top-in{padding:10px 14px}.wrap{padding:14px 14px 56px}
    .search{margin-left:0;width:100%}.search input{flex:1;width:auto;max-width:none;min-width:0}
    .top-r{margin-left:0;width:100%;justify-content:space-between}
    .angle-line{flex-wrap:wrap}
    .angle-btn{margin-left:0}
    .legend{margin-left:0}
    .rb{grid-template-columns:40px minmax(0,1fr);grid-template-areas:"rk nm" "rk fit" "rk rs";row-gap:6px}
    .ledger::before{left:20px}
    .rb .c-nm{grid-area:nm}.rb .c-fit{grid-area:fit}.rb .c-rs{grid-area:rs}.rb .rk{grid-area:rk;align-self:start}
    .empty,.more{padding-left:0}
    .sl{grid-template-columns:1fr 1fr 34px}.sl label{grid-column:1/-1}
  }
</style>
</head>
<body>
<div class="notice" id="notice"><div class="notice-in" id="notice-txt"></div></div>
<header class="top">
  <div class="top-in">
    <span class="mark">Edge</span>
    <span class="who" id="who"></span>
    <div class="top-r">
      <span id="pulled" class="num"></span>
      <a id="fullscreen" href="#" target="_blank" rel="noopener" style="display:none">Open full-screen ↗</a>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="angle" aria-labelledby="angle-h">
    <h1 id="angle-h" class="sr">Your angle</h1>
    <div class="angle-line">
      <div class="angle-txt" id="angle-txt"></div>
      <button class="angle-btn" id="angle-btn" aria-expanded="false" aria-controls="form">Set your angle</button>
    </div>
    <div class="form" id="form">
      <div class="g2">
        <div>
          <label class="fld" for="company">Your company <span class="why">· signs every draft</span></label>
          <input type="text" id="company" autocomplete="organization">
        </div>
        <div>
          <label class="fld" for="service">What you offer <span class="why">· opens every draft</span></label>
          <textarea id="service"></textarea>
        </div>
      </div>
      <div class="g2" style="margin-top:12px">
        <div>
          <label class="fld" for="purpose">Who you want to meet <span class="why">· steers the ranking; mention stage and partner type</span></label>
          <textarea id="purpose"></textarea>
          <div class="parsed" id="parsed" aria-live="polite"></div>
        </div>
        <div>
          <label class="fld" for="signoff">Your sign-off <span class="why">· closes every draft</span></label>
          <textarea id="signoff" style="min-height:58px"></textarea>
        </div>
      </div>
      <div class="row">
        <button class="btn btn-p" id="apply">Apply and re-rank<span class="dot" aria-hidden="true"></span></button>
        <span class="lbl" style="min-width:0">Tone</span>
        <label class="chip"><input type="radio" name="tone" value="formal" checked>Professional</label>
        <label class="chip"><input type="radio" name="tone" value="casual">Warm</label>
        <button class="btn btn-g" id="voice-btn" type="button">Match my greeting and sign-off…</button>
      </div>
      <div id="voice-box" style="display:none;margin-top:10px">
        <label class="fld" for="voice">Paste one of your own emails <span class="why">· we copy its greeting, sign-off and tone. Nothing else is read.</span></label>
        <textarea id="voice" style="min-height:52px"></textarea>
        <div class="row" style="margin-top:8px"><button class="btn btn-g" id="voice-apply" type="button">Use this greeting and sign-off</button></div>
      </div>

      <div class="subh">Refine the ranking</div>
      <div class="row" style="margin-top:0"><span class="lbl">Target stage</span><span id="stage-chks"></span></div>
      <div class="row"><span class="lbl">Partner type</span><span id="type-chks"></span></div>
      <div class="hint" id="type-hint"></div>
      <div id="sliders" style="margin-top:8px"></div>
      <div class="hint" style="margin-top:6px">Weights are relative. Rules with a zero weight are ignored. Ties are broken by how much public data a company has, then by name.</div>
    </div>
  </section>

  <div class="bar" role="tablist" aria-label="Views">
    <button class="tab" role="tab" id="tab-list" aria-selected="true" aria-controls="view-list">Shortlist<span class="n num" id="n-list"></span></button>
    <button class="tab" role="tab" id="tab-queue" aria-selected="false" aria-controls="view-queue">Outreach<span class="n num" id="n-queue"></span></button>
    <div class="search">
      <label class="sr" for="q">Search all exhibitors</label>
      <input type="search" id="q" placeholder="Why isn't … on the list? Search all exhibitors">
      <button class="export" id="export" type="button">Export CSV</button>
    </div>
  </div>

  <section id="view-list" role="tabpanel" aria-labelledby="tab-list">
    <div class="legend" id="legend" aria-hidden="true"></div>
    <ol class="ledger" id="ledger" aria-label="Ranked shortlist"></ol>
    <div class="more" id="more"></div>
  </section>
  <section id="view-queue" role="tabpanel" aria-labelledby="tab-queue" hidden>
    <div class="queue" id="queue"></div>
  </section>

  <footer class="foot" id="foot"></footer>
</main>

<div class="scrim" id="scrim">
  <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="card-h" tabindex="-1"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const norm=x=>(x==null?"":String(x)).trim().toLowerCase();

const inter=(a,b)=>{const sb=new Set((b||[]).map(norm));return (a||[]).map(norm).filter(x=>sb.has(x));};

  const excl=(m.exclude_companies||[]).map(norm).filter(Boolean);

  if(m.partner_types&&m.partner_types.length){const ok=m.partner_types.map(norm).includes(norm(p.partner_type));
    ch.push(["partner type",ok,"is "+typeLabel(p.partner_type)]);if(!ok)f.push("partner type");}
  if(m.therapeutic_areas&&m.therapeutic_areas.length){const ov=inter(m.therapeutic_areas,p.therapeutic_areas);
    ch.push(["therapeutic-area overlap",ov.length>0,ov.length?"shared: "+ov.join(", "):"no shared area"]);if(!ov.length)f.push("therapeutic area");}
  if(m.deal_types&&m.deal_types.length){if(p.deal_appetite&&p.deal_appetite.length){const ov=inter(m.deal_types,p.deal_appetite);
    ch.push(["deal-type overlap",ov.length>0,ov.length?"shared: "+ov.join(", "):"no shared deal type"]);if(!ov.length)f.push("deal type");}
    else ch.push(["deal-type overlap",true,"appetite unknown, not gated"]);}
  if(m.modalities&&m.modalities.length){const ov=inter(m.modalities,p.modalities);
    ch.push(["modality overlap",ov.length>0,ov.length?"shared: "+ov.join(", "):"no shared modality"]);if(!ov.length)f.push("modality");}
  if(m.geos&&m.geos.length){const geo=[p.headquarters].concat(p.geographies||[]).filter(Boolean);
    if(geo.length){const ov=inter(m.geos,geo);ch.push(["geo overlap",ov.length>0,ov.length?"shared: "+ov.join(", "):"no shared geography"]);if(!ov.length)f.push("geography");}}
  return {passed:ch.length?f.length===0:true,checks:ch,fails:f};}
function rTa(o,p){const w=(o.must&&o.must.therapeutic_areas)||[];if(!w.length)return[0,"no therapeutic area set"];
  const ov=inter(w,p.therapeutic_areas);return[Math.min(ov.length/w.length,1),ov.length+"/"+w.length+" of your areas covered"];}
function rStrategic(o,p){const gaps=(p.pipeline_gaps||[]).map(norm).join(" ");if(!gaps)return[0,"no stated pipeline gaps"];
  const m=o.must||{},la=o.lead_asset||{};let sig=(m.therapeutic_areas||[]).map(norm).concat((m.modalities||[]).map(norm),[norm(la.target),norm(la.indication)]).filter(Boolean);
  if(!sig.length)return[0,"no client signals to match gaps"];const hits=sig.filter(s=>gaps.includes(s));
  return[Math.min(hits.length/Math.max(sig.length,1)*2,1),"gap matches: "+(hits.join(", ")||"none")];}
function rStageFit(o,p){const a=p.typical_deal_stage,b=o.pipeline_stage||((o.lead_asset||{}).stage);
  if(!a||!b||!(a in SO)||!(b in SO))return[0,"stage data missing"];const d=Math.abs(SO[a]-SO[b]);return[Math.max(0,1-d/3),"Δ"+d+" from your stage"];}
function rBd(o,p,cfg){const tr=(p.recent_triggers||[]).length,ap=(p.deal_appetite&&p.deal_appetite.length)?1:0,n=tr+ap;
  const t=(cfg&&cfg.min_signals!=null)?cfg.min_signals:2;
  return[t>0?Math.min(n/t,1):1,tr+" recent signal"+(tr===1?"":"s")+(ap?" + stated appetite":"")+" (target "+t+")"];}
function rCap(o,p){const c=norm(p.financial_capacity)||"unknown";return[CAP[c]||0,"funding: "+c];}

  if(/phase\s*(2|ii)\b|clinical[- ]stage|early[- ]clinical|mid[- ]stage/.test(t))sb.push("phase_2");
  if(/phase\s*(3|iii)\b|pivotal|registration|late[- ]stage/.test(t))sb.push("phase_3");

  const pt=[];if(/biotechs?\b|emerging\b|start-?ups?\b|biopharma/.test(t))pt.push("biotech");
  if(/\bbig pharma\b|\bpharma(?:ceutical)?s?\b|large pharma|mid-?size pharma|biopharma/.test(t)){pt.push("big_pharma");pt.push("mid_pharma");}
  if(/\binvestors?\b|\bventure capital\b|\bvcs?\b|\bfunds?\b/.test(t))pt.push("vc");
  if(/\bcros?\b|\bcdmos?\b|\bvendors?\b|\bservice providers?\b|\boutsourc/.test(t))pt.push("cro_cdmo");
  if(/\bacademic|\buniversit|\binstitute|\bgovernment|\bhospital/.test(t))pt.push("academic");

  clear(el);el.appendChild(h("span",{},["Read as: ",h("b",{text:p.types.length?p.types.map(typeLabel).join(", "):"any type"})," at ",h("b",{text:p.stages.length?p.stages.map(stageLabel).join(", "):"any stage"})]));}

  toast((p.stages.length||p.types.length)?"Re-ranked for "+typesLabel()+" at "+bandLabel():"Drafts updated. Ranking unchanged: no stage or type found in your text.");}
function buildControls(){
  const S=clear($("stage-chks"));STAGES.forEach(s=>{const on=(OBJ.stage_band||[]).includes(s);
    const cb=h("input",{type:"checkbox"});cb.checked=on;cb.addEventListener("change",()=>{OBJ.stage_band=OBJ.stage_band||[];
      OBJ.stage_band=cb.checked?Array.from(new Set(OBJ.stage_band.concat(s))):OBJ.stage_band.filter(x=>x!==s);buildControls();refresh();});
    S.appendChild(h("label",{class:"chip"+(on?" on":"")},[cb,stageLabel(s)]));});
  const T=clear($("type-chks"));TYPES.forEach(t=>{const on=(OBJ.must.partner_types||[]).includes(t);
    const cb=h("input",{type:"checkbox"});cb.checked=on;cb.addEventListener("change",()=>{OBJ.must.partner_types=OBJ.must.partner_types||[];
      OBJ.must.partner_types=cb.checked?Array.from(new Set(OBJ.must.partner_types.concat(t))):OBJ.must.partner_types.filter(x=>x!==t);buildControls();refresh();});
    T.appendChild(h("label",{class:"chip"+(on?" on":"")},[cb,typeLabel(t)]));});
  $("type-hint").textContent=(OBJ.must.partner_types||[]).length?"":"No partner-type filter: every exhibitor passes, including the ones that could not be classified. Tick a type to focus the list.";
  const W=clear($("sliders"));Object.keys(RULES).forEach(k=>{const cfg=OBJ.prefer[k]||{};if(!(cfg.weight>0)&&!LIVE_RULES.has(k))return;
    const w=cfg.weight||0;const rng=h("input",{type:"range",min:"0",max:"50",id:"w-"+k,"aria-label":RULES[k][0]+" weight"});rng.value=w;
    const b=h("b",{class:"num",text:String(w)});rng.addEventListener("input",()=>{OBJ.prefer[k]=OBJ.prefer[k]||{};OBJ.prefer[k].weight=+rng.value;b.textContent=rng.value;refresh();});
    W.appendChild(h("div",{class:"sl"},[h("label",{for:"w-"+k,text:RULES[k][0]}),rng,b]));});}
function learnVoice(){const s=$("voice").value||"";if(!s.trim()){toast("Paste one of your own emails first");return;}
  const m=s.match(/(?:^|\n)\s*(best wishes|best regards|kind regards|warm regards|warm wishes|regards|sincerely|many thanks|thanks|cheers|best|yours)\b[\s\S]*/i);
  if(m)$("signoff").value=m[0].trim();
  const g=s.match(/\b(dear|hello|hi|hey)\b/i);if(g){const w=g[1].toLowerCase();GREETING=(w==="hey"||w==="hi")?"Hi":w.charAt(0).toUpperCase()+w.slice(1);}
  const casual=/(!|\bhey\b|\bcheers\b|\bwanna\b|\bgonna\b|\bawesome\b|\bexcited\b|\blove to\b)/i.test(s);TONE=casual?"casual":"formal";
  const r=document.querySelector('input[name=tone][value='+TONE+']');if(r)r.checked=true;
  toast("Using your greeting (“"+GREETING+"”), sign-off and "+(TONE==="casual"?"warm":"professional")+" tone");redraw();}
function showTab(t){const list=t==="list";$("tab-list").setAttribute("aria-selected",list);$("tab-queue").setAttribute("aria-selected",!list);
  $("view-list").hidden=!list;$("view-queue").hidden=list;if(!list)renderQueue();}
function csv(){const esc=v=>{v=(v==null?"":String(v));if(/^\s*[=+\-@\t\r]/.test(v))v="'"+v;   // never let a cell open as a spreadsheet formula
  return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const head=["rank","company","partner_type","stage","fit","status","top_reason","data_known_of_5","draft"];
  const rows=RANKED.map(c=>[c.rank,c.name,typeLabel(c.partner_type),stageLabel(c.typical_deal_stage),c.fit,STATUS[c.name]||"draft",c.reasons[0]?c.reasons[0].label:"",c.knownN,draftFor(c)]);
  const txt=[head].concat(rows).map(r=>r.map(esc).join(",")).join("\r\n");
  const blob=new Blob(["﻿"+txt],{type:"text/csv;charset=utf-8"});const a=h("a",{href:URL.createObjectURL(blob),download:"edge-shortlist-"+norm(CONF).replace(/\s+/g,"-")+".csv"});
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast("Exported "+RANKED.length+" rows");}

// ─────────────────────────────────────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────────────────────────────────────
(function init(){
  document.title="Edge · "+(DATA.client||"")+" × "+CONF;
  $("pulled").textContent=DATA.universe.length+" exhibitors · pulled "+(DATA.pulled||DATA.generated||"");
  $("company").placeholder=C.sender||DATA.client||"Your company";
  $("service").placeholder=C.service_ph||"One line on what you offer.";
  $("purpose").placeholder=C.purpose_ph||"Who do you want to meet? Mention stage and partner type.";
  $("voice").placeholder=C.voice_ph||"Paste one of your own emails.";
  $("signoff").value=C.signoff||"Kind regards,\n[Name]\n[Title]";
  const restored=restore();
  if(EMBEDDED){const n=$("notice");n.classList.add("on");clear($("notice-txt")).appendChild(h("span",{},[
    "You are looking at Edge inside the portfolio page. Your edits are not kept here. ",h("a",{href:location.href,target:"_blank",rel:"noopener",text:"Open Edge full-screen"})," to keep your work between visits."]));
    const fs=$("fullscreen");fs.href=location.href;fs.style.display="";}
  else if(!PERSIST){const n=$("notice");n.classList.add("on");$("notice-txt").textContent="This browser is blocking local storage, so your edits will not survive a reload.";}
  else if(C.banner){const n=$("notice");n.classList.add("on");$("notice-txt").textContent=C.banner;}
  $("angle-btn").addEventListener("click",()=>{const f=$("form"),open=!f.classList.contains("open");f.classList.toggle("open",open);
    $("angle-btn").setAttribute("aria-expanded",open);$("angle-btn").textContent=open?"Hide":"Set your angle";if(open)$("company").focus();});
  $("apply").addEventListener("click",applyPurpose);
  $("purpose").addEventListener("input",()=>{DIRTY=true;$("apply").classList.add("dirty");showParsed();});
  $("purpose").addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key==="Enter")applyPurpose();});
  ["company","service","signoff"].forEach(id=>$(id).addEventListener("input",redraw));
  document.querySelectorAll('input[name=tone]').forEach(r=>r.addEventListener("change",()=>{TONE=r.value;redraw();}));
  $("voice-btn").addEventListener("click",()=>{const b=$("voice-box");b.style.display=b.style.display==="none"?"":"none";if(b.style.display!=="none")$("voice").focus();});
  $("voice-apply").addEventListener("click",learnVoice);
  $("tab-list").addEventListener("click",()=>showTab("list"));$("tab-queue").addEventListener("click",()=>showTab("queue"));
  document.querySelector(".bar[role=tablist]").addEventListener("keydown",e=>{if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight"&&e.key!=="Home"&&e.key!=="End")return;
    const list=document.activeElement===$("tab-list");if(!list&&document.activeElement!==$("tab-queue"))return;
    const next=(e.key==="Home")?"list":(e.key==="End")?"queue":(list?"queue":"list");showTab(next);$("tab-"+next).focus();e.preventDefault();});
  $("q").addEventListener("input",()=>{showTab("list");renderList();});
  $("export").addEventListener("click",csv);
  Object.keys(RULES).forEach(k=>{if(DATA.universe.some(p=>RULES[k][1](OBJ,p,OBJ.prefer[k]||{})[0]>0))LIVE_RULES.add(k);});
  showParsed();buildControls();renderFoot();refresh();
  if(restored)toast("Restored your last session: angle, drafts and approvals");
})();
</script>
